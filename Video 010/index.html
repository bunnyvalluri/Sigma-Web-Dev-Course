<!doctype html>
<html lang="en">
  <head>
    <!-- Character Encoding: UTF-8 standard -->
    <meta charset="UTF-8" />
    <!-- Viewport Configuration: Responsive scaling for mobile devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <video
      src="video.mp4"
      height="255"
      controls
      loop
      muted
      poster="download.jpg"
    ></video>

    <audio src="sachin.mp3" controls autoplay loop muted></audio>

    <svg height="100" width="100">
      <circle
        cx="50"
        cy="50"
        r="40"
        stroke="black"
        stroke-width="3"
        fill="red"
      />
    </svg>
    <img src="img.svg" alt="My Svg Image" />

    <!-- <iframe src="https://www.codewithharry.com/tutorial/html-iframes/" width="322" height="444"></iframe> -->

    <iframe
      width="560"
      height="400"
      src="https://valluri-rahul-portfolio.vercel.app/"
      title="YouTube video player"
      frameborder="0"
      allow="
        accelerometer;
        autoplay;
        clipboard-write;
        encrypted-media;
        gyroscope;
        picture-in-picture;
        web-share;
      "
      allowfullscreen
    ></iframe>

    <!-- Quick Quiz  -->
    <!-- Create a website which shows videos of different category and audios of different categories.
    You can use YouTube videos in an iframe using YouTube's embedding feature -->
  </body>
</html>
