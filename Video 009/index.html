  Topic: HTML ID & Class Selectors
  File: index.html
  
  Description:
    Demonstrates assigning identifiers (id) and classes (class) to HTML elements for targeting with CSS.
  ==========================================================================
-->
<!doctype html>
<html lang="en">
  <head>
    <!-- Character Encoding: UTF-8 standard -->
    <meta charset="UTF-8" />
    <!-- Viewport Configuration: Responsive scaling for mobile devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ID and Classes in HTML</title>
    <!-- Link External Stylesheet -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="firstdiv" class="red bg-yellow">First</div>
    <div id="seconddiv">Second</div>
    <span class="red"></span>
  </body>
</html>
